name: Windows fork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'spec/**'
      - 'linux/core/**'
      - 'linux/relay/**'
      - 'VERSION'
      - '.github/workflows/windows-fork.yml'

permissions:
  contents: read

jobs:
  relay:
    name: Relay (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: linux/relay/build-static.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: fork-relay-${{ matrix.arch }}
          path: linux/relay/dist/agent-speed-relay-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    needs: relay
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: fork-relay-*
          path: linux/relay/dist
          merge-multiple: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test Windows solution
        if: matrix.arch == 'x64'
        run: dotnet test windows/AgentSpeed.slnx -c Release
      - name: Publish with native helpers and remote relays
        shell: pwsh
        run: ./windows/scripts/publish.ps1 -Architectures '${{ matrix.arch }}'
      - name: Write checksum
        shell: pwsh
        run: |
          $package = 'dist/AgentSpeed-Windows-${{ matrix.arch }}.zip'
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($package))" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows-${{ matrix.arch }}
          path: |
            dist/AgentSpeed-Windows-${{ matrix.arch }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
